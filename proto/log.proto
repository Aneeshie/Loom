syntax = "proto3";

package loom.v1;

option go_package = "github.com/Aneeshie/loom/proto";

message SendLogRequest {
  string service_name = 1;
  string host = 2;
  string level = 3;
  string message = 4;
  int64 timestamp = 5;
}

message SendLogResponse {
  string message = 1;
}

message Log {
  int64 id = 1;
  string service_name = 2;
  string host = 3;
  string level = 4;
  string message = 5;
  int64 timestamp = 6;
}

message GetLogsResponse {
  repeated Log logs = 1;
}

message GetLogsRequest {
  int64 limit = 1;
  LogFilter filter = 2;
}

message LogFilter {
  optional string level = 1;
  optional string service_name = 2;
  optional string host = 3;

  optional string search = 4;
  optional int64 start_time = 5;
}

message StreamLogsRequest {
  LogFilter filter = 1;
}

message SimilarLogsRequest {
  string query = 1;
  int64 limit = 2;
}

service LogService {
  rpc SendLog(SendLogRequest) returns (SendLogResponse);

  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);

  rpc StreamLogs(StreamLogsRequest) returns (stream Log);

  rpc SimilarLogs(SimilarLogsRequest) returns (GetLogsResponse);
}
